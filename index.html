
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHM 101 CBT Round 2</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background-color: #edf1f7;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

header, .question, #result {
    background-color: white;
    padding: 22px;
    margin-bottom: 18px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

h1 { color: #123b66; }

.info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-weight: bold;
}

#timer { color: red; }

.question h3 {
    font-size: 17px;
    line-height: 1.5;
}

.option {
    display: block;
    padding: 12px;
    margin: 9px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    cursor: pointer;
}

.option:hover {
    background-color: #e6f1ff;
}

button {
    padding: 13px 22px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

#submit {
    background-color: #145b91;
    color: white;
}

#reset {
    background-color: #ddd;
}

#result { display: none; }

.answer {
    padding: 13px;
    margin: 12px 0;
    background-color: #f3f5f8;
    border-radius: 7px;
    line-height: 1.5;
}

.correct { border-left: 5px solid green; }
.incorrect { border-left: 5px solid red; }

.explanation {
    margin-top: 8px;
    color: #435366;
}

@media(max-width:600px) {
    body { padding: 8px; }
    header, .question, #result { padding: 15px; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>CHM 101 – CBT ROUND 2</h1>
    <p>Redeemer University | 100 Level</p>
    <p><strong>Topic: Electronic Configuration</strong></p>

    <div class="info">
        <span>20 Questions</span>
        <span id="timer">15:00</span>
        <span id="progress">Answered: 0/20</span>
    </div>
</header>

<form id="quiz">
    <div id="questions"></div>

    <button type="submit" id="submit">SUBMIT ANSWERS</button>
    <button type="button" id="reset">RESTART TEST</button>
</form>

<div id="result"></div>

</div>

<script>

const questions = [

{
q:"Which of the following sets of quantum numbers is NOT possible?",
o:[
"n = 2, l = 1, ml = 0, ms = +1/2",
"n = 3, l = 2, ml = -2, ms = -1/2",
"n = 2, l = 2, ml = 0, ms = +1/2",
"n = 4, l = 0, ml = 0, ms = -1/2"
],
a:2,
e:"For n = 2, l can only be 0 or 1. The value l = 2 is not permitted."
},

{
q:"An electron occupies a 5f orbital. What is the value of its azimuthal quantum number?",
o:["0","1","2","3"],
a:3,
e:"The letters correspond to l values: s = 0, p = 1, d = 2, f = 3."
},

{
q:"How many possible orientations are available for a d orbital subshell?",
o:["3","5","7","10"],
a:1,
e:"For d, l = 2. Number of orbitals = 2l + 1 = 5."
},

{
q:"An electron has n = 3 and l = 0. Which statement is correct?",
o:[
"It belongs to a 3p orbital",
"It belongs to a 3s orbital",
"It belongs to a 3d orbital",
"It belongs to a 2s orbital"
],
a:1,
e:"When l = 0, the orbital is s. Since n = 3, it is 3s."
},

{
q:"What is the maximum number of electrons that can occupy the fourth principal energy level?",
o:["8","18","24","32"],
a:3,
e:"Using 2n²: 2 × 4² = 32 electrons."
},

{
q:"Which of these subshells contains seven orbitals?",
o:["s","p","d","f"],
a:3,
e:"An f subshell has seven orbitals and can accommodate 14 electrons."
},

{
q:"If an atom has 17 electrons, how many electrons will occupy its 3p subshell in the ground state?",
o:["2","3","5","6"],
a:3,
e:"Chlorine has 17 electrons: 1s² 2s² 2p⁶ 3s² 3p⁵. Correction: its 3p subshell contains 5 electrons.",
corrected:3
},

{
q:"Which principle explains why 4s fills before 3d in the usual filling sequence?",
o:[
"Hund's rule",
"Pauli's exclusion principle",
"Aufbau principle",
"Law of conservation of mass"
],
a:2,
e:"The Aufbau principle requires electrons to occupy the lowest available energy orbital first. The usual sequence places 4s before 3d."
},

{
q:"An orbital already contains two electrons. Which arrangement is allowed?",
o:[
"Both electrons have spin +1/2",
"Both electrons have spin -1/2",
"One has +1/2 and the other has -1/2",
"Both electrons have identical four quantum numbers"
],
a:2,
e:"Pauli's exclusion principle requires the two electrons in one orbital to have opposite spins."
},

{
q:"Which electronic configuration represents nitrogen (Z = 7)?",
o:[
"1s² 2s² 2p³",
"1s² 2s² 2p⁵",
"1s² 2s¹ 2p⁴",
"1s² 2s² 2p²"
],
a:0,
e:"Nitrogen has 7 electrons: 2 + 2 + 3 = 7."
},

{
q:"An element has the electronic configuration 1s² 2s² 2p⁶ 3s² 3p⁴. Identify the element.",
o:["Sulfur","Chlorine","Argon","Phosphorus"],
a:0,
e:"Total electrons = 2 + 2 + 6 + 2 + 4 = 16. Atomic number 16 is sulfur."
},

{
q:"Which of the following follows Hund's rule?",
o:[
"2p orbitals are paired before being singly occupied",
"Electrons occupy equal-energy orbitals singly before pairing",
"Every orbital can hold four electrons",
"Electrons always occupy the highest energy orbital first"
],
a:1,
e:"Hund's rule states that degenerate orbitals are occupied singly before electrons pair."
},

{
q:"Which configuration is the correct ground-state configuration of copper?",
o:[
"[Ar] 4s² 3d⁹",
"[Ar] 4s¹ 3d¹⁰",
"[Ar] 4s² 3d¹⁰",
"[Ar] 4s¹ 3d⁹"
],
a:1,
e:"Copper is an exception. Its actual configuration is [Ar] 4s¹ 3d¹⁰ because a completely filled d subshell has extra stability."
},

{
q:"How many electrons are present in an O²⁻ ion? (Oxygen has atomic number 8.)",
o:["6","8","10","12"],
a:2,
e:"O²⁻ gains two electrons. Total = 8 + 2 = 10 electrons."
},

{
q:"Which configuration belongs to Mg²⁺? (Mg has atomic number 12.)",
o:[
"1s² 2s² 2p⁶",
"1s² 2s² 2p⁶ 3s²",
"1s² 2s² 2p⁴",
"1s² 2s² 2p⁶ 3s¹"
],
a:0,
e:"Magnesium loses its two 3s electrons, leaving 10 electrons: 1s² 2s² 2p⁶."
},

{
q:"Which orbital has a spherical shape?",
o:["p","d","f","s"],
a:3,
e:"The s orbital is spherical. The p orbital is dumb-bell shaped."
},

{
q:"Which statement about the 3d subshell is correct?",
o:[
"It belongs to the third principal energy level",
"It contains seven orbitals",
"It can hold a maximum of 6 electrons",
"It fills before 4s in the usual Aufbau sequence"
],
a:0,
e:"3d belongs to n = 3, has five orbitals and holds a maximum of 10 electrons. In the usual sequence, 4s fills before 3d."
},

{
q:"What is the correct configuration of Fe²⁺ if neutral iron is [Ar] 4s² 3d⁶?",
o:[
"[Ar] 4s² 3d⁴",
"[Ar] 4s¹ 3d⁵",
"[Ar] 3d⁶",
"[Ar] 3d⁴"
],
a:2,
e:"Transition metals lose their 4s electrons before 3d electrons. Fe²⁺ loses both 4s electrons."
},

{
q:"Which statement correctly compares a shell, subshell and orbital?",
o:[
"A shell contains orbitals only and no subshells",
"A subshell contains orbitals, while a shell contains subshells",
"An orbital contains several shells",
"A shell and an orbital mean exactly the same thing"
],
a:1,
e:"A shell is a principal energy level. It contains subshells, and subshells contain orbitals."
},

{
q:"An atom has the configuration [Ne] 3s² 3p⁵. How many electrons does it have?",
o:["15","16","17","18"],
a:2,
e:"Ne represents 10 electrons. Adding 2 + 5 gives 17 electrons. The element is chlorine."
}

];

// Display questions

const holder = document.getElementById("questions");

questions.forEach((item, i) => {

    const section = document.createElement("div");
    section.className = "question";

    section.innerHTML =
    `<h3>${i+1}. ${item.q}</h3>` +

    item.o.map((option,j) => `
        <label class="option">
        <input type="radio" name="q${i}" value="${j}">
        ${String.fromCharCode(65+j)}. ${option}
        </label>
    `).join("");

    holder.appendChild(section);

});

// Progress tracker

const form = document.getElementById("quiz");

form.addEventListener("change", () => {

    const count = questions.filter((_,i) =>
        form.querySelector(`input[name="q${i}"]:checked`)
    ).length;

    document.getElementById("progress").textContent =
    `Answered: ${count}/20`;

});

// Timer

let remaining = 15 * 60;
let finished = false;
let interval;

function tick() {

    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;

    document.getElementById("timer").textContent =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    if (remaining <= 0) {
        finish();
    } else {
        remaining--;
    }

}

tick();
interval = setInterval(tick, 1000);

// Submit and mark

function finish() {

    if (finished) return;

    finished = true;
    clearInterval(interval);

    let score = 0;
    let review = "";

    questions.forEach((item,i) => {

        const selected = form.querySelector(
            `input[name="q${i}"]:checked`
        );

        const chosen = selected ? Number(selected.value) : -1;

        const good = chosen === item.a;

        if (good) score++;

        const yourAnswer = chosen === -1
            ? "Not answered"
            : `${String.fromCharCode(65+chosen)}. ${item.o[chosen]}`;

        review += `
        <div class="answer ${good ? "correct" : "incorrect"}">

        <strong>Question ${i+1}: ${good ? "CORRECT" : "INCORRECT"}</strong>

        <p>Your answer: ${yourAnswer}</p>

        <p>Correct answer:
        ${String.fromCharCode(65+item.a)}. ${item.o[item.a]}</p>

        <div class="explanation">
        Explanation: ${item.e}
        </div>

        </div>`;

    });

    document.querySelectorAll("#quiz input").forEach(input => {
        input.disabled = true;
    });

    document.getElementById("submit").disabled = true;

    const result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `
        <h2>YOUR RESULT</h2>
        <h1>${score}/20</h1>
        <h3>${Math.round(score/20*100)}%</h3>
        <p>${score >= 16 ? "Excellent performance!" :
             score >= 10 ? "Good attempt. Keep practising." :
             "Keep revising. Study the explanations carefully."}</p>
        <hr>
        <h2>ANSWERS AND EXPLANATIONS</h2>
        ${review}
    `;

    result.scrollIntoView({behavior:"smooth"});

}

form.addEventListener("submit", function(e) {
    e.preventDefault();
    finish();
});

// Restart

document.getElementById("reset").addEventListener("click", function() {
    location.reload();
});

</script>

</body>
</html>
